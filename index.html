<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Binary Trading Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#020617',
                        cardBg: '#0f172a',
                        borderCol: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- TradingView Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#020617] text-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Auth Modal / Configuration Overlay -->
    <div id="authModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-5">
            <div class="text-center space-y-1">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 mb-2 font-bold text-xl">⚡</div>
                <h2 class="text-xl font-bold tracking-tight">Deriv Authentication</h2>
                <p class="text-xs text-slate-400">Enter your Deriv API Token to activate live trading & demo wallet balance.</p>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">API Token</label>
                    <input type="password" id="apiTokenInput" placeholder="e.g. j7X8... (Deriv API Token)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div id="authError" class="text-xs text-rose-500 hidden text-center"></div>
                <button id="authSubmitBtn" onclick="handleAuth()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] transition font-semibold text-sm py-3 rounded-xl shadow-lg shadow-emerald-900/20 text-white">
                    Connect & Start Trading
                </button>
            </div>
            <div class="text-[10px] text-slate-500 text-center leading-relaxed">
                Don't have a token? Generate one from your <a href="https://app.deriv.com/account/api-token" target="_blank" class="text-emerald-400 underline">Deriv API Settings</a> page.
            </div>
        </div>
    </div>

    <!-- Fixed Header -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#020617]/90 border-b border-slate-800/80 backdrop-blur z-20 shrink-0">
        <div class="flex items-center space-x-2.5">
            <div class="relative flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 font-black text-sm">
                V
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-tight leading-none">VELLIX</h1>
                <div class="flex items-center space-x-1.5 mt-1">
                    <span id="wsStatusDot" class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                    <span id="wsStatusText" class="text-[10px] text-slate-400 font-medium">Connecting...</span>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-3 bg-slate-900/90 border border-slate-800/80 rounded-xl px-3 py-1.5">
            <div class="text-right">
                <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Demo Balance</div>
                <div id="accountBalance" class="text-xs font-bold text-emerald-400">$0.00</div>
            </div>
            <button onclick="showAuthModal()" class="text-slate-400 hover:text-slate-200 p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <!-- Main Section with Interactive Chart Container -->
    <main class="flex-1 relative flex flex-col overflow-hidden">
        <!-- Asset Selector Overlay & Live Price Badge -->
        <div class="absolute top-3 left-3 right-3 z-10 flex items-center justify-between pointer-events-none">
            <div class="pointer-events-auto bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-1.5 backdrop-blur shadow-lg flex items-center space-x-2">
                <select id="assetSelect" onchange="switchAsset(this.value)" class="bg-transparent text-xs font-bold text-slate-100 focus:outline-none cursor-pointer">
                    <option value="1HZ10V" class="bg-slate-900 text-slate-100">Volatility 10 (1s) [1HZ10V]</option>
                    <option value="1HZ50V" class="bg-slate-900 text-slate-100">Volatility 50 (1s) [1HZ50V]</option>
                    <option value="1HZ100V" class="bg-slate-900 text-slate-100">Volatility 100 (1s) [1HZ100V]</option>
                    <option value="R_100" class="bg-slate-900 text-slate-100">Bear Market Index [R_100]</option>
                </select>
            </div>
            <div class="pointer-events-auto bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-1.5 backdrop-blur shadow-lg flex items-center space-x-2">
                <span id="livePriceIndicator" class="text-xs font-mono font-bold text-slate-100">--.----</span>
                <span id="priceArrow" class="text-xs"></span>
            </div>
        </div>

        <!-- Chart Container -->
        <div id="chartContainer" class="w-full flex-1"></div>

        <!-- Active Contracts Notification Toast Container -->
        <div id="toastContainer" class="absolute top-16 left-3 right-3 z-20 flex flex-col space-y-2 pointer-events-none"></div>
    </main>

    <!-- Sticky Bottom Trading Dock -->
    <footer class="bg-slate-900/95 border-t border-slate-800/80 p-4 backdrop-blur z-20 shrink-0 space-y-3">
        <div class="grid grid-cols-2 gap-3">
            <!-- Stake Input -->
            <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-2.5">
                <div class="flex items-center justify-between mb-1">
                    <label class="text-[10px] uppercase font-semibold text-slate-400">Stake ($)</label>
                    <div class="flex space-x-1">
                        <button onclick="adjustStake(-5)" class="px-1.5 py-0.5 bg-slate-900 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300">-5</button>
                        <button onclick="adjustStake(5)" class="px-1.5 py-0.5 bg-slate-900 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300">+5</button>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="text-sm font-bold text-slate-400 mr-1">$</span>
                    <input type="number" id="stakeInput" value="10" min="0.35" step="1" class="w-full bg-transparent text-sm font-bold text-slate-100 focus:outline-none">
                </div>
            </div>

            <!-- Duration Input -->
            <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-2.5">
                <div class="flex items-center justify-between mb-1">
                    <label class="text-[10px] uppercase font-semibold text-slate-400">Duration (Ticks)</label>
                    <div class="flex space-x-1">
                        <button onclick="adjustDuration(-1)" class="px-1.5 py-0.5 bg-slate-900 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300">-1</button>
                        <button onclick="adjustDuration(1)" class="px-1.5 py-0.5 bg-slate-900 hover:bg-slate-800 rounded text-[10px] font-bold text-slate-300">+1</button>
                    </div>
                </div>
                <div class="flex items-center">
                    <input type="number" id="durationInput" value="5" min="1" max="10" step="1" class="w-full bg-transparent text-sm font-bold text-slate-100 focus:outline-none">
                    <span class="text-xs font-semibold text-slate-400 ml-1">Ticks</span>
                </div>
            </div>
        </div>

        <!-- Execution Buttons -->
        <div class="grid grid-cols-2 gap-3">
            <button id="riseBtn" disabled onclick="executeTrade('CALL')" class="bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed transition font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-950/40 flex items-center justify-center space-x-2 text-white">
                <span class="text-lg">▲</span>
                <div class="text-left">
                    <div class="text-xs tracking-wider uppercase leading-none">RISE</div>
                    <div class="text-[10px] font-normal opacity-80 mt-0.5">Payout: $19.50</div>
                </div>
            </button>
            <button id="fallBtn" disabled onclick="executeTrade('PUT')" class="bg-rose-600 hover:bg-rose-500 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed transition font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-rose-950/40 flex items-center justify-center space-x-2 text-white">
                <span class="text-lg">▼</span>
                <div class="text-left">
                    <div class="text-xs tracking-wider uppercase leading-none">FALL</div>
                    <div class="text-[10px] font-normal opacity-80 mt-0.5">Payout: $19.50</div>
                </div>
            </button>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const APP_ID = '1089';
        const WS_URL = `wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`;

        let ws = null;
        let chart = null;
        let candleSeries = null;
        let currentAsset = '1HZ10V';
        let apiToken = localStorage.getItem('deriv_api_token') || '';
        let isAuthorized = false;
        let lastPrice = null;

        function initChart() {
            const container = document.getElementById('chartContainer');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: {
                    background: { type: LightweightCharts.ColorType.Solid, color: '#020617' },
                    textColor: '#94a3b8',
                },
                grid: {
                    vertLines: { color: '#0f172a' },
                    horzLines: { color: '#0f172a' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: true,
                    borderColor: '#1e293b',
                },
                rightPriceScale: {
                    borderColor: '#1e293b',
                },
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#10b981',
                downColor: '#f43f5e',
                borderUpColor: '#10b981',
                borderDownColor: '#f43f5e',
                wickUpColor: '#10b981',
                wickDownColor: '#f43f5e',
            });

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
            });
        }

        function connectWebSocket() {
            const statusDot = document.getElementById('wsStatusDot');
            const statusText = document.getElementById('wsStatusText');

            statusDot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
            statusText.textContent = 'Connecting...';

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
                statusText.textContent = 'Connected';

                if (apiToken) {
                    ws.send(JSON.stringify({ authorize: apiToken }));
                }

                subscribeAsset(currentAsset);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };

            ws.onclose = () => {
                statusDot.className = 'w-2 h-2 rounded-full bg-rose-500 animate-pulse';
                statusText.textContent = 'Reconnecting...';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket Error:', error);
                ws.close();
            };
        }

        function subscribeAsset(symbol) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({ forget_all: 'ticks' }));
            ws.send(JSON.stringify({ forget_all: 'candles' }));

            ws.send(JSON.stringify({
                ticks_history: symbol,
                adjust_start_time: 1,
                count: 100,
                end: 'latest',
                style: 'candles',
                granularity: 60
            }));

            ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
        }

        function switchAsset(symbol) {
            currentAsset = symbol;
            subscribeAsset(symbol);
        }

        function handleServerMessage(data) {
            const msgType = data.msg_type;

            if (msgType === 'authorize') {
                if (data.error) {
                    showAuthError(data.error.message);
                    localStorage.removeItem('deriv_api_token');
                } else {
                    isAuthorized = true;
                    hideAuthModal();
                    document.getElementById('accountBalance').textContent = `$${Number(data.authorize.balance).toFixed(2)}`;
                    document.getElementById('riseBtn').removeAttribute('disabled');
                    document.getElementById('fallBtn').removeAttribute('disabled');
                }
            } else if (msgType === 'ticks_history') {
                if (data.candles) {
                    const formattedCandles = data.candles.map(c => ({
                        time: c.epoch,
                        open: c.open,
                        high: c.high,
                        low: c.low,
                        close: c.close
                    }));
                    candleSeries.setData(formattedCandles);
                }
            } else if (msgType === 'tick') {
                const tick = data.tick;
                if (tick && tick.symbol === currentAsset) {
                    const price = tick.quote;
                    const time = tick.epoch;
                    updateLivePriceDisplay(price);

                    const barTime = Math.floor(time / 60) * 60;
                    const currentBars = candleSeries.data();
                    if (currentBars.length > 0) {
                        let lastBar = currentBars[currentBars.length - 1];
                        if (lastBar.time === barTime) {
                            lastBar.high = Math.max(lastBar.high, price);
                            lastBar.low = Math.min(lastBar.low, price);
                            lastBar.close = price;
                            candleSeries.update(lastBar);
                        } else {
                            candleSeries.update({
                                time: barTime,
                                open: price,
                                high: price,
                                low: price,
                                close: price
                            });
                        }
                    }
                }
            } else if (msgType === 'buy') {
                if (data.error) {
                    showToast(data.error.message, 'rose');
                } else {
                    const contract = data.buy;
                    showToast(`Contract Purchased! ID: ${contract.contract_id}`, 'emerald');
                    if (ws && ws.readyState === WebSocket.OPEN && isAuthorized) {
                        ws.send(JSON.stringify({ balance: 1 }));
                    }
                }
            } else if (msgType === 'balance') {
                if (data.balance) {
                    document.getElementById('accountBalance').textContent = `$${Number(data.balance.balance).toFixed(2)}`;
                }
            }
        }

        function updateLivePriceDisplay(price) {
            const priceEl = document.getElementById('livePriceIndicator');
            const arrowEl = document.getElementById('priceArrow');

            if (lastPrice !== null) {
                if (price > lastPrice) {
                    priceEl.className = 'text-xs font-mono font-bold text-emerald-400';
                    arrowEl.textContent = '▲';
                    arrowEl.className = 'text-xs text-emerald-400';
                } else if (price < lastPrice) {
                    priceEl.className = 'text-xs font-mono font-bold text-rose-400';
                    arrowEl.textContent = '▼';
                    arrowEl.className = 'text-xs text-rose-400';
                }
            }
            priceEl.textContent = price.toFixed(5);
            lastPrice = price;
        }

        function executeTrade(contractType) {
            if (!isAuthorized) {
                showAuthModal();
                return;
            }

            const stake = parseFloat(document.getElementById('stakeInput').value);
            const duration = parseInt(document.getElementById('durationInput').value);

            if (isNaN(stake) || stake <= 0) {
                showToast('Please enter a valid stake amount.', 'rose');
                return;
            }

            if (isNaN(duration) || duration < 1) {
                showToast('Please enter a valid duration in ticks.', 'rose');
                return;
            }

            const buyRequest = {
                buy: "1",
                price: stake,
                parameters: {
                    amount: stake,
                    basis: "stake",
                    currency: "USD",
                    symbol: currentAsset,
                    duration: duration,
                    duration_unit: "t",
                    contract_type: contractType
                }
            };

            ws.send(JSON.stringify(buyRequest));
            showToast(`Submitting ${contractType}
